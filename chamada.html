<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamada de Pacientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.15.2/mqtt.min.js"></script>
<script>
  if(sessionStorage.getItem('cp_auth_chamada') !== '1'){
    window.location.href = 'index.html';
  }
</script>
<style>
  :root{
    --bg:#0E2226;
    --bg-raised:#122E33;
    --line:#264C4F;
    --amber:#F4A93B;
    --mint:#6FCF9E;
    --ink:#F2F0E6;
    --muted:#7FA0A0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #163338 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header{
    padding:22px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.12em;
    font-size:14px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .clock{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    color:var(--muted);
    letter-spacing:.05em;
  }
  .status{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#C0453A;}
  .dot.online{background:var(--mint); animation:pulse 2.2s infinite;}
  .dot.connecting{background:var(--amber);}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(111,207,158,.5);}
    70%{box-shadow:0 0 0 9px rgba(111,207,158,0);}
    100%{box-shadow:0 0 0 0 rgba(111,207,158,0);}
  }
  .gear{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 8px;}

  .code-row{
    display:none;
    gap:10px; align-items:center;
    background:var(--bg-raised);
    padding:14px 40px;
    border-bottom:1px solid var(--line);
  }
  .code-row.open{display:flex;}
  .code-row input{
    padding:8px 12px; font-size:14px; border-radius:6px; border:1px solid var(--line);
    background:#0E2226; color:var(--ink);
  }
  .code-row button{
    padding:8px 14px; border:none; border-radius:6px; background:var(--mint);
    color:#0E2226; font-weight:700; cursor:pointer;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    position:relative;
  }

  .idle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    color:var(--muted);
  }
  .idle .breathe{
    width:14px;height:14px;border-radius:50%;
    background:var(--mint);
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1); opacity:.6;}
    50%{transform:scale(1.6); opacity:1;}
  }
  .idle span.label{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:15px;
  }

  .call{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .call.show{display:flex;}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.24em;
    text-transform:uppercase;
    font-size:15px;
    color:var(--amber);
  }

  .flap-row{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    max-width:90vw;
  }
  .flap{
    perspective:400px;
  }
  .flap-inner{
    background:linear-gradient(180deg, #1B4046 0%, #10282C 100%);
    border:1px solid #2C5A5E;
    border-radius:8px;
    padding:10px 4px;
    min-width:52px;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:64px;
    line-height:1;
    color:var(--ink);
    text-transform:uppercase;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    transform-origin:center;
    animation:flip .5s ease;
  }
  @keyframes flip{
    0%{transform:rotateX(90deg); opacity:0;}
    60%{transform:rotateX(-8deg); opacity:1;}
    100%{transform:rotateX(0deg); opacity:1;}
  }

  .room-line{
    margin-top:20px;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:38px;
    color:var(--mint);
    letter-spacing:.02em;
  }
  .room-line b{
    color:var(--amber);
  }

  footer{
    padding:20px 40px;
    border-top:1px solid var(--line);
  }
  footer h2{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 12px 0;
  }
  .board{
    display:flex;
    gap:10px;
    overflow-x:auto;
  }
  .row{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--muted);
  }
  .row b{ color:var(--ink); font-weight:700; }
  .row .r{ color:var(--amber); font-weight:700; }
</style>
</head>
<body>

<header>
  <div class="brand">● Chamada de Pacientes</div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="clock" id="clock">--:--</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">conectando…</span></div>
    <button class="gear" id="gearBtn">⚙</button>
    <button class="gear" id="logoutBtn" style="font-size:12px;">Sair</button>
  </div>
</header>

<div class="code-row" id="codeRow">
  <span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mint);">Código da unidade:</span>
  <input type="text" id="codeInput">
  <button id="codeSave">Salvar</button>
</div>

<main>
  <div class="idle" id="idleState">
    <div class="breathe"></div>
    <span class="label">Aguardando chamada</span>
  </div>

  <div class="call" id="callState">
    <div class="eyebrow">Compareça ao consultório</div>
    <div class="flap-row" id="flapRow"></div>
    <div class="room-line">Consultório <b id="roomNum">1</b></div>
  </div>
</main>

<footer>
  <h2>Últimas chamadas</h2>
  <div class="board" id="board"><span style="color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:13px;">Nenhuma chamada ainda.</span></div>
</footer>

<script>
  const STORAGE_KEY = 'cp_codigo_unidade';
  let codigo = localStorage.getItem(STORAGE_KEY) || 'clinica-01';
  document.getElementById('codeInput').value = codigo;

  // relógio
  function tick(){
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }
  tick(); setInterval(tick, 1000);

  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  function setStatus(state){
    dot.className = 'dot ' + state;
    statusText.textContent = state === 'online' ? 'conectado' : state === 'connecting' ? 'conectando…' : 'offline';
  }

  let client;
  let brokerIndex = 0;
  let switchTimer;
  const BROKERS = [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://test.mosquitto.org:8081/mqtt',
  ];
  function connect(){
    if(client){ try{ client.end(true); }catch(e){} }
    setStatus('connecting');
    client = mqtt.connect(BROKERS[brokerIndex], {
      clientId: 'chamada_' + Math.random().toString(16).slice(2),
      reconnectPeriod: 3000,
      connectTimeout: 6000,
    });
    clearTimeout(switchTimer);
    switchTimer = setTimeout(()=>{
      if(!client.connected){
        brokerIndex = (brokerIndex + 1) % BROKERS.length;
        connect();
      }
    }, 7000);
    client.on('connect', ()=>{
      clearTimeout(switchTimer);
      setStatus('online');
      client.subscribe(topic());
    });
    client.on('reconnect', ()=> setStatus('connecting'));
    client.on('close', ()=> setStatus('offline'));
    client.on('error', ()=> setStatus('offline'));
    client.on('message', (t, payload)=>{
      try{
        const data = JSON.parse(payload.toString());
        handleCall(data);
      }catch(e){}
    });
  }
  function topic(){ return 'chamadorcons/' + codigo + '/chamada'; }
  connect();

  const gearBtn = document.getElementById('gearBtn');
  const codeRow = document.getElementById('codeRow');
  gearBtn.addEventListener('click', ()=> codeRow.classList.toggle('open'));

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    sessionStorage.removeItem('cp_auth_chamada');
    window.location.href = 'index.html';
  });
  document.getElementById('codeSave').addEventListener('click', ()=>{
    const val = document.getElementById('codeInput').value.trim();
    if(!val) return;
    codigo = val;
    localStorage.setItem(STORAGE_KEY, codigo);
    codeRow.classList.remove('open');
    connect();
  });

  const idleState = document.getElementById('idleState');
  const callState = document.getElementById('callState');
  const flapRow = document.getElementById('flapRow');
  const roomNum = document.getElementById('roomNum');
  const board = document.getElementById('board');
  let calls = [];

  function handleCall(data){
    const nome = (data.nome || '').toString().trim();
    const room = (data.consultorio || '').toString().trim();
    if(!nome) return;

    idleState.style.display = 'none';
    callState.classList.remove('show');
    void callState.offsetWidth; // reinicia animação
    callState.classList.add('show');

    flapRow.innerHTML = '';
    nome.split('').forEach((ch, i)=>{
      const flap = document.createElement('div');
      flap.className = 'flap';
      const inner = document.createElement('div');
      inner.className = 'flap-inner';
      inner.style.animationDelay = (i * 0.03) + 's';
      inner.textContent = ch === ' ' ? '\u00A0' : ch;
      flap.appendChild(inner);
      flapRow.appendChild(flap);
    });
    roomNum.textContent = room;

    speak(nome, room);

    calls.unshift({nome, room, ts: data.ts || Date.now()});
    calls = calls.slice(0, 10);
    renderBoard();
  }

  function renderBoard(){
    if(calls.length === 0) return;
    board.innerHTML = calls.map(c=>{
      const d = new Date(c.ts);
      const time = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      return `<div class="row"><span>${time}</span><b>${escapeHtml(c.nome)}</b><span class="r">CONS. ${escapeHtml(c.room)}</span></div>`;
    }).join('');
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function speak(nome, room, repeticoes){
    if(!('speechSynthesis' in window)) return;
    const reps = repeticoes || 2;
    const text = `Paciente ${nome}, compareça ao consultório ${room}, por favor.`;
    let count = 0;
    function say(){
      if(count >= reps) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'pt-BR';
      utter.rate = 0.95;
      utter.onend = ()=>{ count++; if(count < reps) setTimeout(say, 600); };
      speechSynthesis.speak(utter);
    }
    speechSynthesis.cancel();
    say();
  }

  // desbloqueia a síntese de voz em navegadores que exigem interação do usuário
  document.body.addEventListener('click', ()=>{
    if('speechSynthesis' in window && speechSynthesis.getVoices().length === 0){
      speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    }
  }, {once:true});
</script>

</body>
</html>
