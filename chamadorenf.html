<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Enfermagem — Chamada de Pacientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  if(sessionStorage.getItem('cp_auth_chamadorenf') !== '1'){
    window.location.href = 'index.html';
  }
</script>
<style>
  :root{
    --ink:#10262A;
    --paper:#EFF3F2;
    --paper-raised:#FFFFFF;
    --line:#D3DEDC;
    --mint:#1F6F5C;
    --mint-soft:#DCEEE8;
    --amber:#F4A93B;
    --amber-deep:#C77E12;
    --red:#C0453A;
    --muted:#5C716E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:var(--paper-raised);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--mint);
    border:1.5px solid var(--mint);
    padding:3px 7px;
    border-radius:4px;
  }
  .brand h1{
    font-size:18px;
    margin:0;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.04em;
    color:var(--muted);
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--red);
    transition:background .3s;
    box-shadow:0 0 0 0 rgba(192,69,58,.5);
  }
  .dot.online{
    background:var(--mint);
    animation:pulse 2.2s infinite;
  }
  .dot.connecting{ background:var(--amber); }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(31,111,92,.45);}
    70%{box-shadow:0 0 0 7px rgba(31,111,92,0);}
    100%{box-shadow:0 0 0 0 rgba(31,111,92,0);}
  }
  .gear{
    background:none;border:none;cursor:pointer;
    color:var(--muted);font-size:18px;padding:4px 8px;border-radius:6px;
  }
  .gear:hover{background:var(--mint-soft);color:var(--mint);}

  main{
    flex:1;
    display:grid;
    grid-template-columns:minmax(320px,460px) 1fr;
    gap:0;
  }
  @media (max-width:860px){
    main{grid-template-columns:1fr;}
  }

  .panel{
    padding:36px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
    border-right:1px solid var(--line);
  }
  label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    display:block;
    margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    padding:16px 16px;
    font-size:22px;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    border:2px solid var(--line);
    border-radius:10px;
    background:var(--paper-raised);
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus{border-color:var(--mint);}

  .rooms{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .room-btn{
    padding:16px 8px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--paper-raised);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s;
  }
  .room-btn:hover{border-color:var(--mint);}
  .room-btn.active{
    background:var(--mint);
    border-color:var(--mint);
    color:#fff;
  }

  .call-btn{
    margin-top:6px;
    padding:20px;
    border:none;
    border-radius:12px;
    background:var(--amber);
    color:#2B1B02;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:.01em;
    cursor:pointer;
    transition:transform .08s, background .15s;
    box-shadow:0 3px 0 var(--amber-deep);
  }
  .call-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--amber-deep);}
  .call-btn:disabled{opacity:.5;cursor:not-allowed;}
  .call-btn:hover:not(:disabled){background:#f7b959;}

  .flash{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--mint);
    min-height:16px;
    letter-spacing:.03em;
  }

  .code-row{
    display:none;
    gap:8px;
    align-items:center;
    background:var(--mint-soft);
    padding:12px 14px;
    border-radius:10px;
  }
  .code-row.open{display:flex;}
  .code-row input{
    flex:1;
    padding:8px 10px;
    font-size:14px;
    font-weight:600;
    border-radius:6px;
    border:1.5px solid var(--line);
  }
  .code-row button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:var(--mint);
    color:#fff;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }

  .history{
    padding:36px 40px;
    overflow-y:auto;
  }
  .history h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
    margin:0 0 18px 0;
  }
  .ticket{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 16px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--mint);
    border-radius:8px;
    margin-bottom:10px;
    animation:slideIn .25s ease;
  }
  @keyframes slideIn{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .ticket .time{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    width:52px;
    flex-shrink:0;
  }
  .ticket .name{
    font-weight:700;
    font-size:15px;
    flex:1;
  }
  .ticket .room{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:12px;
    color:var(--mint);
    background:var(--mint-soft);
    padding:4px 9px;
    border-radius:5px;
  }
  .empty{
    color:var(--muted);
    font-size:14px;
    font-style:italic;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">ENF</span>
    <h1>Chamada de Pacientes — Enfermagem</h1>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">conectando…</span>
    </div>
    <button class="gear" id="gearBtn" title="Configurar código da unidade">⚙</button>
    <button class="gear" id="logoutBtn" title="Sair" style="font-size:13px;">Sair</button>
  </div>
</header>

<div class="code-row" id="codeRow">
  <span style="font-size:12px; font-weight:700; color:var(--mint);">Código da unidade:</span>
  <input type="text" id="codeInput" placeholder="ex: clinica-centro">
  <button id="codeSave">Salvar</button>
</div>

<main>
  <section class="panel">
    <div>
      <label>Modo de chamada</label>
      <div class="rooms" style="grid-template-columns:1fr 1fr 1fr;">
        <button class="room-btn mode-btn active" id="modeNomeBtn">Nome do paciente</button>
        <button class="room-btn mode-btn" id="modeSalasBtn">Salas</button>
        <button class="room-btn mode-btn" id="modeLabBtn">Laboratório (numerado)</button>
      </div>
    </div>
    <div id="nomeField">
      <label for="nome">Nome do paciente</label>
      <input type="text" id="nome" placeholder="Digite o nome" autocomplete="off">
    </div>
    <div id="labField" style="display:none;">
      <label>Próxima chamada</label>
      <div style="padding:14px 16px; background:var(--mint-soft); border-radius:10px; font-weight:700; color:var(--mint);" id="labPreview">Laboratório 1</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button id="labBackBtn" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--line); background:var(--paper-raised); color:var(--muted); font-size:13px; cursor:pointer;">⏮ Voltar</button>
        <button id="labSkipBtn" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--line); background:var(--paper-raised); color:var(--muted); font-size:13px; cursor:pointer;">⏭ Pular</button>
        <button id="labResetBtn" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--line); background:var(--paper-raised); color:var(--muted); font-size:13px; cursor:pointer;">↺ Zerar</button>
      </div>
    </div>
    <div id="nomeSalasField" style="display:none;">
      <label for="nomeSalas">Nome do paciente</label>
      <input type="text" id="nomeSalas" placeholder="Digite o nome" autocomplete="off">
    </div>
    <div id="roomBlockNursing">
      <label>Sala</label>
      <div class="rooms" id="roomList" style="grid-template-columns:1fr;">
        <button class="room-btn active" data-room="Sala de pré-consulta">Sala de pré-consulta</button>
        <button class="room-btn" data-room="Sala de procedimentos">Sala de procedimentos</button>
        <button class="room-btn" data-room="Sala de inalação">Sala de inalação</button>
        <button class="room-btn" data-room="Sala de vacina">Sala de vacina</button>
        <button class="room-btn" data-room="Consultório enfermagem">Consultório enfermagem</button>
        <button class="room-btn" data-room="Auditório">Auditório</button>
      </div>
    </div>
    <div id="roomBlockSalas" style="display:none;">
      <label>Sala</label>
      <div class="rooms" id="roomListSalas" style="grid-template-columns:1fr;">
        <button class="room-btn" data-room="Consultório 1">Consultório 1</button>
        <button class="room-btn" data-room="Consultório 2">Consultório 2</button>
        <button class="room-btn" data-room="Consultório 3">Consultório 3</button>
        <button class="room-btn" data-room="Consultório 4">Consultório 4</button>
      </div>
    </div>
    <button class="call-btn" id="callBtn">Chamar paciente</button>
    <div class="flash" id="flash"></div>
  </section>

  <section class="history">
    <h2>Histórico de chamadas</h2>
    <div id="historyList"><p class="empty">Nenhuma chamada realizada ainda.</p></div>
  </section>
</main>

<script>
  const STORAGE_KEY = 'cp_codigo_unidade';
  let codigo = localStorage.getItem(STORAGE_KEY) || 'clinica-01';
  document.getElementById('codeInput').value = codigo;

  let selectedRoom = 'Sala de pré-consulta';
  let selectedRoomSalas = 'Consultório 1';
  document.querySelectorAll('#roomList .room-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#roomList .room-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      selectedRoom = btn.dataset.room;
    });
  });
  document.querySelectorAll('#roomListSalas .room-btn').forEach((btn, i)=>{
    if(i === 0) btn.classList.add('active');
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#roomListSalas .room-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      selectedRoomSalas = btn.dataset.room;
    });
  });

  // ---- Alternância entre "nome do paciente", "salas" e "laboratório (numerado)" ----
  let modo = 'nome'; // 'nome', 'salas' ou 'lab'
  const modeNomeBtn = document.getElementById('modeNomeBtn');
  const modeSalasBtn = document.getElementById('modeSalasBtn');
  const modeLabBtn = document.getElementById('modeLabBtn');
  const nomeField = document.getElementById('nomeField');
  const nomeSalasField = document.getElementById('nomeSalasField');
  const nomeSalasInput = document.getElementById('nomeSalas');
  const labField = document.getElementById('labField');
  const roomBlockNursing = document.getElementById('roomBlockNursing');
  const roomBlockSalas = document.getElementById('roomBlockSalas');
  const labPreview = document.getElementById('labPreview');
  const LAB_COUNT_KEY = 'cp_lab_count';
  function getLabCount(){ return parseInt(localStorage.getItem(LAB_COUNT_KEY) || '0', 10); }
  function setLabCount(n){ localStorage.setItem(LAB_COUNT_KEY, String(n)); }
  function renderLabPreview(){ labPreview.textContent = 'Laboratório ' + (getLabCount() + 1); }
  renderLabPreview();

  function setModo(novoModo){
    modo = novoModo;
    modeNomeBtn.classList.toggle('active', modo === 'nome');
    modeSalasBtn.classList.toggle('active', modo === 'salas');
    modeLabBtn.classList.toggle('active', modo === 'lab');
    nomeField.style.display = modo === 'nome' ? '' : 'none';
    nomeSalasField.style.display = modo === 'salas' ? '' : 'none';
    labField.style.display = modo === 'lab' ? '' : 'none';
    roomBlockNursing.style.display = (modo === 'nome' || modo === 'lab') ? '' : 'none';
    roomBlockSalas.style.display = modo === 'salas' ? '' : 'none';
    callBtn.textContent = modo === 'lab' ? 'Chamar laboratório' : 'Chamar paciente';
  }
  modeNomeBtn.addEventListener('click', ()=> setModo('nome'));
  modeSalasBtn.addEventListener('click', ()=> setModo('salas'));
  modeLabBtn.addEventListener('click', ()=> setModo('lab'));

  document.getElementById('labBackBtn').addEventListener('click', ()=>{
    const atual = getLabCount();
    if(atual <= 0){ flash('O contador já está em zero.'); return; }
    setLabCount(atual - 1);
    renderLabPreview();
    flash('Voltou: próxima chamada agora é Laboratório ' + atual + '.');
  });
  document.getElementById('labSkipBtn').addEventListener('click', ()=>{
    const pulado = getLabCount() + 1;
    setLabCount(pulado);
    renderLabPreview();
    flash('Laboratório ' + pulado + ' pulado (sem chamar).');
  });
  document.getElementById('labResetBtn').addEventListener('click', ()=>{
    if(!confirm('Zerar o contador do laboratório? Essa ação não pode ser desfeita.')) return;
    setLabCount(0);
    renderLabPreview();
    flash('Contador do laboratório zerado.');
  });

  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  function setStatus(state){
    dot.className = 'dot ' + state;
    statusText.textContent = state === 'online' ? 'conectado' : state === 'connecting' ? 'conectando…' : 'offline';
  }

  let socket;
  let reconnectTimer;
  function sanitize(c){ return c.toLowerCase().replace(/[^a-z0-9-]/g, '-'); }
  function topicName(){ return 'chamadorcons-' + sanitize(codigo); }

  function connect(){
    if(socket){ try{ socket.close(); }catch(e){} }
    clearTimeout(reconnectTimer);
    setStatus('connecting');
    socket = new WebSocket('wss://ntfy.sh/' + topicName() + '/ws');
    socket.addEventListener('open', ()=> setStatus('online'));
    socket.addEventListener('close', ()=>{
      setStatus('offline');
      reconnectTimer = setTimeout(connect, 4000);
    });
    socket.addEventListener('error', ()=> setStatus('offline'));
  }
  connect();

  const gearBtn = document.getElementById('gearBtn');
  const codeRow = document.getElementById('codeRow');
  gearBtn.addEventListener('click', ()=> codeRow.classList.toggle('open'));

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    sessionStorage.removeItem('cp_auth_chamadorenf');
    window.location.href = 'index.html';
  });
  document.getElementById('codeSave').addEventListener('click', ()=>{
    const val = document.getElementById('codeInput').value.trim();
    if(!val) return;
    codigo = val;
    localStorage.setItem(STORAGE_KEY, codigo);
    codeRow.classList.remove('open');
    flash('Código da unidade salvo: ' + codigo);
  });

  const flashEl = document.getElementById('flash');
  let flashTimer;
  function flash(msg){
    flashEl.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(()=> flashEl.textContent = '', 3000);
  }

  const nomeInput = document.getElementById('nome');
  const callBtn = document.getElementById('callBtn');
  const historyList = document.getElementById('historyList');
  let history = [];

  async function chamar(){
    let nome, destino;
    if(modo === 'lab'){
      nome = 'Laboratório ' + (getLabCount() + 1);
      destino = selectedRoom;
    }else if(modo === 'salas'){
      nome = nomeSalasInput.value.trim();
      if(!nome){ nomeSalasInput.focus(); return; }
      destino = selectedRoomSalas;
    }else{
      nome = nomeInput.value.trim();
      if(!nome){ nomeInput.focus(); return; }
      destino = selectedRoom;
    }
    const payload = { nome, consultorio: destino, ts: Date.now() };
    callBtn.disabled = true;
    try{
      const resp = await fetch('https://ntfy.sh/' + topicName(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
      });
      if(!resp.ok) throw new Error('falha no envio');
      flash('Chamada enviada: ' + nome + ' → ' + destino);
      if(modo === 'lab'){
        setLabCount(getLabCount() + 1);
        renderLabPreview();
      }
      history.unshift(payload);
      history = history.slice(0, 20);
      renderHistory();
      nomeInput.value = '';
      nomeSalasInput.value = '';
      nomeInput.focus();
    }catch(e){
      flash('Falha ao enviar — verifique sua conexão com a internet.');
    }finally{
      callBtn.disabled = false;
    }
  }

  function renderHistory(){
    if(history.length === 0){
      historyList.innerHTML = '<p class="empty">Nenhuma chamada realizada ainda.</p>';
      return;
    }
    historyList.innerHTML = history.map(h=>{
      const d = new Date(h.ts);
      const time = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      return `<div class="ticket">
        <span class="time">${time}</span>
        <span class="name">${escapeHtml(h.nome)}</span>
        <span class="room">${escapeHtml(h.consultorio)}</span>
      </div>`;
    }).join('');
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  callBtn.addEventListener('click', chamar);
  nomeInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') chamar(); });
  nomeSalasInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') chamar(); });
</script>

</body>
</html>
