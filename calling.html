<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamada de pacientes</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fafaf9;
    color: #1c1917;
    padding: 24px 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .icon-box {
    background: #1d4ed8; width: 42px; height: 42px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-box svg { width: 22px; height: 22px; stroke: white; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 13px; color: #78716c; }

  .card {
    background: white; border: 1px solid #e7e5e4; border-radius: 12px;
    padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }

  /* Painel de chamada atual */
  .painel {
    background: #1c1917; border-radius: 14px; padding: 32px 24px; text-align: center;
    margin-bottom: 20px; color: white;
  }
  .painel .label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #a8a29e; margin-bottom: 10px; }
  .painel .nome { font-size: 34px; font-weight: 600; margin-bottom: 10px; line-height: 1.2; word-break: break-word; }
  .painel .nome.vazio { color: #78716c; font-size: 20px; font-weight: 400; }
  .painel .consultorio-badge {
    display: inline-flex; align-items: center; gap: 8px; background: #1d4ed8;
    padding: 8px 20px; border-radius: 999px; font-size: 16px; font-weight: 600;
  }

  /* Formulário */
  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr auto;
    gap: 12px;
    align-items: end;
  }
  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
  }
  label { display: block; font-size: 12px; font-weight: 500; color: #78716c; margin-bottom: 4px; }
  input, select {
    width: 100%; height: 42px; padding: 0 12px; border: 1px solid #d6d3d1;
    border-radius: 8px; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
    background: white; font-family: inherit;
  }
  input:focus, select:focus { border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,0.15); }

  button.call-btn {
    height: 42px; padding: 0 20px; background: #1d4ed8; color: white; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 8px; justify-content: center;
    transition: background .15s;
  }
  button.call-btn:hover { background: #1e3a8a; }
  button.call-btn svg { width: 16px; height: 16px; }

  .options-row {
    display: flex; align-items: center; gap: 8px; margin-top: 14px;
    font-size: 13px; color: #78716c;
  }
  .options-row select { width: auto; height: 32px; padding: 0 8px; font-size: 13px; }

  /* Histórico */
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: #44403c; }
  .historico-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px; border-bottom: 1px solid #f5f5f4; font-size: 14px;
  }
  .historico-item:last-child { border-bottom: none; }
  .historico-item .nome { font-weight: 500; color: #292524; }
  .historico-item .direita { display: flex; align-items: center; gap: 10px; }
  .historico-item .hora { color: #a8a29e; font-size: 12px; }
  .historico-item .badge {
    background: #eff6ff; color: #1d4ed8; font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
  }
  .repetir-btn {
    background: none; border: none; cursor: pointer; color: #a8a29e; padding: 4px;
    display: flex; align-items: center; justify-content: center; border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .repetir-btn:hover { color: #1d4ed8; background: #eff6ff; }
  .repetir-btn svg { width: 16px; height: 16px; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 20px; color: #a8a29e;
  }
  .empty-state p { margin: 0; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
    </div>
    <div>
      <h1>Chamada de pacientes</h1>
      <p>Digite o nome, escolha o consultório e chame por áudio</p>
    </div>
  </header>

  <div class="card" id="log-card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
    <div>
      <div style="font-size:13px; font-weight:500; color:#292524;">Log de chamadas (log.txt)</div>
      <div style="font-size:12px; color:#a8a29e; margin-top:2px;" id="log-status">Nenhuma pasta selecionada</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="call-btn" style="background:#44403c;" onclick="selecionarPasta()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Selecionar pasta Documentos
      </button>
      <button class="call-btn" style="background:#78716c;" onclick="baixarLog()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Baixar log.txt
      </button>
    </div>
  </div>

  <div class="painel">
    <div class="label">Chamando agora</div>
    <div class="nome vazio" id="painel-nome">Aguardando chamada</div>
    <div class="consultorio-badge" id="painel-consultorio" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span id="painel-consultorio-texto">Consultório 1</span>
    </div>
  </div>

  <div class="card">
    <div class="form-grid">
      <div>
        <label for="nome-paciente">Nome do paciente</label>
        <input type="text" id="nome-paciente" placeholder="Nome do paciente">
      </div>
      <div>
        <label for="consultorio">Consultório</label>
        <select id="consultorio">
          <option value="1">Consultório 1</option>
          <option value="2">Consultório 2</option>
          <option value="3">Consultório 3</option>
        </select>
      </div>
      <button class="call-btn" onclick="chamarPaciente()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        Chamar
      </button>
    </div>
    <div class="options-row">
      <span>Repetir aviso:</span>
      <select id="repeticoes">
        <option value="1">1 vez</option>
        <option value="2" selected>2 vezes</option>
        <option value="3">3 vezes</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2>Histórico de chamadas</h2>
    <div id="historico-lista">
      <div class="empty-state" id="historico-vazio">
        <p>Nenhuma chamada realizada ainda</p>
      </div>
    </div>
  </div>

</div>

<script>
  let historico = [];
  let dirHandle = null; // pasta selecionada pelo usuário (ex: Documentos)
  const suportaSistemaArquivos = 'showDirectoryPicker' in window;

  async function selecionarPasta() {
    if (!suportaSistemaArquivos) {
      alert('Este navegador não permite escolher uma pasta diretamente. Use o botão "Baixar log.txt" para salvar manualmente.');
      return;
    }
    try {
      dirHandle = await window.showDirectoryPicker();
      document.getElementById('log-status').textContent = 'Gravando automaticamente em: ' + dirHandle.name + '/log.txt';
    } catch (err) {
      // usuário cancelou a seleção
    }
  }

  async function escreverLogArquivo(linha) {
    if (!dirHandle) return;
    try {
      const permissao = await dirHandle.requestPermission({ mode: 'readwrite' });
      if (permissao !== 'granted') return;
      const fileHandle = await dirHandle.getFileHandle('log.txt', { create: true });
      const file = await fileHandle.getFile();
      const conteudoAtual = await file.text();
      const writable = await fileHandle.createWritable();
      await writable.write(conteudoAtual + linha + '\n');
      await writable.close();
    } catch (err) {
      console.error('Erro ao gravar log.txt:', err);
    }
  }

  function baixarLog() {
    if (historico.length === 0) {
      alert('Ainda não há chamadas registradas.');
      return;
    }
    const linhas = [...historico].reverse().map(h => `${h.nome} - ${h.hora} - Consultório ${h.consultorio}`);
    const blob = new Blob([linhas.join('\n') + '\n'], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'log.txt';
    a.click();
    URL.revokeObjectURL(url);
  }

  function falar(texto, vezes, callback) {
    if (!('speechSynthesis' in window)) {
      alert('Este navegador não suporta áudio de voz (speechSynthesis).');
      return;
    }
    let restantes = vezes;
    function proxima() {
      if (restantes <= 0) {
        if (callback) callback();
        return;
      }
      restantes--;
      const utter = new SpeechSynthesisUtterance(texto);
      utter.lang = 'pt-BR';
      utter.rate = 0.9;
      utter.onend = () => setTimeout(proxima, 500);
      speechSynthesis.speak(utter);
    }
    speechSynthesis.cancel();
    proxima();
  }

  function chamarPaciente() {
    const nomeInput = document.getElementById('nome-paciente');
    const consultorioSelect = document.getElementById('consultorio');
    const repeticoesSelect = document.getElementById('repeticoes');

    const nome = nomeInput.value.trim();
    const consultorio = consultorioSelect.value;
    const vezes = parseInt(repeticoesSelect.value, 10);

    if (!nome) {
      alert('Digite o nome do paciente.');
      nomeInput.focus();
      return;
    }

    atualizarPainel(nome, consultorio);

    const texto = `Paciente ${nome}, comparecer ao consultório ${consultorio}.`;
    falar(texto, vezes);

    adicionarHistorico(nome, consultorio);

    nomeInput.value = '';
    nomeInput.focus();
  }

  function atualizarPainel(nome, consultorio) {
    const painelNome = document.getElementById('painel-nome');
    const painelBadge = document.getElementById('painel-consultorio');
    const painelTexto = document.getElementById('painel-consultorio-texto');

    painelNome.textContent = nome;
    painelNome.classList.remove('vazio');
    painelBadge.style.display = 'inline-flex';
    painelTexto.textContent = 'Consultório ' + consultorio;
  }

  function adicionarHistorico(nome, consultorio) {
    const agora = new Date();
    const hora = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    historico.unshift({ id: Date.now(), nome, consultorio, hora });
    if (historico.length > 20) historico = historico.slice(0, 20);

    renderizarHistorico();
    escreverLogArquivo(`${nome} - ${hora} - Consultório ${consultorio}`);
  }

  function repetirChamada(id) {
    const item = historico.find(h => h.id === id);
    if (!item) return;
    atualizarPainel(item.nome, item.consultorio);
    const texto = `Paciente ${item.nome}, comparecer ao consultório ${item.consultorio}.`;
    const vezes = parseInt(document.getElementById('repeticoes').value, 10);
    falar(texto, vezes);
  }

  function renderizarHistorico() {
    const lista = document.getElementById('historico-lista');
    const vazio = document.getElementById('historico-vazio');

    if (historico.length === 0) {
      lista.innerHTML = '';
      lista.appendChild(vazio);
      return;
    }

    lista.innerHTML = historico.map(item => `
      <div class="historico-item">
        <span class="nome">${escapeHtml(item.nome)}</span>
        <div class="direita">
          <span class="badge">Consultório ${item.consultorio}</span>
          <span class="hora">${item.hora}</span>
          <button class="repetir-btn" onclick="repetirChamada(${item.id})" aria-label="Repetir chamada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('nome-paciente').addEventListener('keydown', e => {
    if (e.key === 'Enter') chamarPaciente();
  });
</script>
</body>
</html>
